---
# =============================================================================
# Bootstrap Playbook
# Configure SSH, /etc/hosts, network interfaces on all nodes
# =============================================================================
- name: Bootstrap Proxmox Nodes
  hosts: proxmox
  become: true
  gather_facts: true
  serial: 1  # One node at a time for network changes
  
  vars:
    # Detect physical interface (bridge-port of vmbr0)
    primary_interface: "{{ ansible_default_ipv4.interface | regex_replace('^vmbr.*', '') }}"
  
  tasks:
    # =========================================================================
    # SSH Configuration
    # =========================================================================
    - name: Enable root SSH with key authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin prohibit-password' }
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
      notify: Restart SSH

    # =========================================================================
    # /etc/hosts Configuration
    # =========================================================================
    - name: Configure /etc/hosts with all cluster nodes
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          # Proxmox Cluster Nodes
          {% for host in groups['proxmox'] %}
          {{ hostvars[host]['pve_cluster_addr0'] }} {{ host }} {{ host | regex_replace('.*-', '') }}
          {% endfor %}
        marker: "# {mark} ANSIBLE MANAGED - PROXMOX CLUSTER"
        create: true

    # =========================================================================
    # Network Configuration
    # =========================================================================
    - name: Detect physical interface from vmbr0
      ansible.builtin.shell: |
        ls /sys/class/net/vmbr0/brif/ 2>/dev/null | head -1 || \
        ip -o link show | grep -E "state UP" | grep -v -E "vmbr|lo|@" | awk -F': ' '{print $2}' | head -1
      register: detected_interface
      changed_when: false
    
    - name: Set primary interface fact
      ansible.builtin.set_fact:
        nic_primary: "{{ detected_interface.stdout | trim }}"
    
    - name: Display detected interface
      ansible.builtin.debug:
        msg: "Primary interface: {{ nic_primary }}"

    - name: Check if VLAN interfaces already exist
      ansible.builtin.shell: grep -q "{{ nic_primary }}.{{ public_vlan }}" /etc/network/interfaces
      register: vlan_exists
      changed_when: false
      failed_when: false

    - name: Configure network interfaces
      ansible.builtin.blockinfile:
        path: /etc/network/interfaces
        block: |
          # VLAN interfaces for Scaleway Private Networks
          auto {{ nic_primary }}.{{ public_vlan }}
          iface {{ nic_primary }}.{{ public_vlan }} inet manual
          
          auto {{ nic_primary }}.{{ cluster_vlan }}
          iface {{ nic_primary }}.{{ cluster_vlan }} inet manual
          
          # Public Network Bridge (Ceph MON, client traffic) - VLAN {{ public_vlan }}
          auto vmbr1
          iface vmbr1 inet static
          	address {{ pve_cluster_addr0 }}/22
          	bridge-ports {{ nic_primary }}.{{ public_vlan }}
          	bridge-stp off
          	bridge-fd 0
          	bridge-vlan-aware yes
          	bridge-vids 2-4094
          	mtu 1500
          #Public Network
          
          # Cluster Network Bridge (Ceph OSD replication) - VLAN {{ cluster_vlan }}
          auto vmbr2
          iface vmbr2 inet static
          	address {{ pve_cluster_addr1 }}/22
          	bridge-ports {{ nic_primary }}.{{ cluster_vlan }}
          	bridge-stp off
          	bridge-fd 0
          	bridge-vlan-aware yes
          	bridge-vids 2-4094
          	mtu 1500
          #Cluster Network
        marker: "# {mark} ANSIBLE MANAGED - PRIVATE NETWORKS"
      when: vlan_exists.rc != 0
      notify: Reload network

    # =========================================================================
    # APT Repository
    # =========================================================================
    - name: Remove enterprise repository if exists
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        state: absent

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Reload network
      ansible.builtin.shell: |
        ifreload -a || systemctl restart networking
      async: 30
      poll: 5
