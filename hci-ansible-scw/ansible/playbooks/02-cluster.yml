---
# =============================================================================
# Proxmox Cluster Setup
# Uses lae.proxmox role for cluster creation and management
# =============================================================================
- name: Configure Proxmox Cluster
  hosts: proxmox
  become: true
  gather_facts: true
  
  pre_tasks:
    - name: Verify network connectivity between nodes
      ansible.builtin.wait_for:
        host: "{{ hostvars[item]['pve_cluster_addr0'] }}"
        port: 22
        timeout: 10
      loop: "{{ groups['proxmox'] }}"
      when: inventory_hostname == groups['proxmox'][0]

  roles:
    - role: geerlingguy.ntp
      vars:
        ntp_manage_config: true
        ntp_servers:
          - 0.fr.pool.ntp.org iburst
          - 1.fr.pool.ntp.org iburst
          - 2.fr.pool.ntp.org iburst
          - 3.fr.pool.ntp.org iburst

    - role: lae.proxmox
      vars:
        pve_group: proxmox
        pve_cluster_enabled: true
        pve_cluster_clustername: "{{ pve_cluster_clustername }}"
        pve_reboot_on_kernel_update: "{{ pve_reboot_on_kernel_update | default(false) }}"
        # Disable Ceph in this playbook - separate playbook for Ceph
        pve_ceph_enabled: false
